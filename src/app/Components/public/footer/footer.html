<!-- The site footer: one quiet row, the same as the footer in the home / employers hero corners -->
<footer class="site-footer has-bottom-nav">
  <div class="footer-row">
    <div class="foot-brand">
      <img [src]="jobUpLogo" alt="" class="foot-logo">
      <span class="foot-name">Job Up</span>
      <span class="foot-copy">© {{ year }} Job Up. ყველა უფლება დაცულია.</span>
    </div>

    <nav class="foot-meta" aria-label="Job Up">
      <a routerLink="/about" routerLinkActive="active">ჩვენ შესახებ</a>
      <button type="button" (click)="modals.openContact()">კონტაქტი</button>
      <a routerLink="/privacy" routerLinkActive="active">კონფიდენციალურობა</a>
      <a routerLink="/terms" routerLinkActive="active">წესები და პირობები</a>
    </nav>
  </div>
</footer>
