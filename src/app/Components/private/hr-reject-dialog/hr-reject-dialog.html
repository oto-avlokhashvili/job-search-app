<div class="overlay" (click)="cancel.emit()">
  <div
    #dialog
    class="dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="reject-title"
    tabindex="-1"
    (click)="$event.stopPropagation()"
  >
    <h2 id="reject-title">უარის მიზეზი</h2>
    @if (candidateName()) {
      <p class="sub">{{ candidateName() }} · მიზეზის მითითება არასავალდებულოა</p>
    } @else {
      <p class="sub">მიზეზის მითითება არასავალდებულოა</p>
    }

    <div class="options" role="radiogroup">
      @for (r of reasons; track r) {
        <label class="option" [class.active]="choice() === r">
          <input type="radio" name="reason" [value]="r" [checked]="choice() === r" (change)="choice.set(r)" />
          {{ r }}
        </label>
      }
      <label class="option" [class.active]="choice() === other">
        <input type="radio" name="reason" [value]="other" [checked]="choice() === other" (change)="choice.set(other)" />
        სხვა
      </label>
      @if (choice() === other) {
        <textarea
          rows="3"
          maxlength="300"
          placeholder="მიუთითეთ მიზეზი"
          [value]="otherText()"
          (input)="otherText.set($any($event.target).value)"
        ></textarea>
      }
    </div>

    <div class="actions">
      <button type="button" class="btn ghost" (click)="cancel.emit()">გაუქმება</button>
      <button type="button" class="btn danger" (click)="confirm.emit(reason())">
        {{ reason() ? 'შენახვა' : 'მიზეზის გარეშე' }}
      </button>
    </div>
  </div>
</div>
