<div class="dashboard-wrapper">
  <div class="private-content-container">
    <!-- Horizontal sub-navbar: only visible when onboarding is completely passed -->
    @if (isOnboardingCompleted() && !isOnboardingRoute()) {
      <div class="private-nav-bar">
        <div class="private-nav-links">
          <a *ngFor="let item of navItems()" [routerLink]="item.route" routerLinkActive="active" class="private-nav-link">
            <span class="nav-icon">{{ item.icon }}</span>
            <span class="nav-label">{{ item.label }}</span>
          </a>
        </div>
      </div>
    }

    <!-- Main Content Area -->
    <div class="main-wrapper">
      <main class="main-content">
        <!-- Router Outlet for Page Content -->
        <router-outlet></router-outlet>
      </main>
    </div>
  </div>

  @if (isOnboardingCompleted() && !isOnboardingRoute()) {
    <app-chat-widget></app-chat-widget>
  }
</div>
